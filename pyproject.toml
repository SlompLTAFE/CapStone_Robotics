
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xarm-toolkit"
version = "0.1.0"
description = "Control a Hiwonder xArm using interchangeable target sources"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "xarm",
    "hidapi",
]

[project.optional-dependencies]
mock = ["pygame>=2.5"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

